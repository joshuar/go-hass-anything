name: 🏗️ Build containers

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}
  MAGEARGS: -d build/magefiles -w .

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check_release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write

    outputs:
      release_created: ${{ steps.release_please.outputs.release_created }}
      release_tag: ${{ steps.release_please.outputs.tag_name }}
      app_version: ${{ steps.set_version.outputs.app_version }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Run release please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release_please
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set app version
        id: set_version
        run: |
          if [ -n "${{ steps.release_please.outputs.tag_name }}" ]; then
            RAW_VERSION="${{ steps.release_please.outputs.tag_name }}"
          else
            RAW_VERSION="$(git describe --tags --always --long --dirty)"
          fi

          # Replace any character that isn't [a-zA-Z0-9_.-] with '-'
          SAFE_VERSION=$(echo "$RAW_VERSION" | sed -e 's/[^a-zA-Z0-9_.-]/-/g')

          # Tags can't start with '.' or '-'
          SAFE_VERSION=$(echo "$SAFE_VERSION" | sed -e 's/^[.-]*//')

          # Enforce 128 char max
          SAFE_VERSION=$(echo "$SAFE_VERSION" | cut -c1-128)

          echo "app_version=$SAFE_VERSION" >> "$GITHUB_OUTPUT"

          echo "Version: $SAFE_VERSION"

  build_container:
    needs: check_release

    permissions:
      contents: write
      packages: write

    runs-on: ubuntu-24.04

    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm/v6
          - linux/arm/v7
          - linux/arm64

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            dl-cdn.alpinelinux.org:443
            ghcr.io:443
            github.com:443
            golang.org:443
            objects.githubusercontent.com:443
            production.cloudflare.docker.com:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            storage.googleapis.com:443
            sum.golang.org:443
            production.cloudfront.docker.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: "false"

      - name: Set up environment
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Set app version for release
        if: ${{ needs.check_release.outputs.release_created }}
        run: echo "APPVERSION=${{ needs.check_release.outputs.release_tag }}" >> $GITHUB_ENV

      - name: Check and install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to the Container registry
        id: registry_login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build container image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ matrix.platform }}
          build-args: |
            APPVERSION=${{ needs.check_release.outputs.app_version }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest to artifact
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          # Sanitise platform name to use as a filename  (e.g. linux_amd64)
          SAFE_PLATFORM=$(echo "${{ matrix.platform }}" | tr '/' '_')
          echo "${{ steps.build.outputs.digest }}" > /tmp/digests/${SAFE_PLATFORM}
          echo "Saved digest ${{ steps.build.outputs.digest }} for ${{ matrix.platform }}"

      - name: Upload digest artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifests & Sign
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: [check_release, build_container]

    permissions:
      contents: read
      packages: write
      id-token: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Download all digest artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr,prefix=pr-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.check_release.outputs.app_version }}
          labels: |
            org.opencontainers.image.title=${{ github.repository }}
            org.opencontainers.image.description=Multi-arch image built by GitHub Actions
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      - name: Create and push multi-arch manifest list
        id: merge
        run: |
          # Collect every digest file and build the source list
          SOURCES=""
          for f in /tmp/digests/*; do
            [ -f "$f" ] || continue
            DIGEST=$(cat "$f")
            SOURCES="${SOURCES} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"
          done

          echo "Sources:${SOURCES}"

          # Build --tag flags from metadata-action output
          TAG_FLAGS=$(echo "${{ steps.meta.outputs.tags }}" \
            | tr '\n' '\0' \
            | xargs -0 -I{} echo "--tag {}" \
            | tr '\n' ' ')

          echo "Tags: ${TAG_FLAGS}"

          # Create the manifest list and push it
          eval docker buildx imagetools create ${TAG_FLAGS} ${SOURCES}

          # Retrieve the digest of the newly created manifest list for signing
          MANIFEST_DIGEST=$(docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')

          echo "manifest_digest=${MANIFEST_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Manifest digest: ${MANIFEST_DIGEST}"

      - name: Sign manifest list with cosign (keyless)
        env:
          DIGEST: ${{ steps.merge.outputs.manifest_digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "${TAGS}" | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            IMAGE_REF="${tag}@${DIGEST}"
            echo "Signing: ${IMAGE_REF}"
            cosign sign --yes "${IMAGE_REF}"
          done

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.merge.outputs.manifest_digest }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Attest SBOM with cosign
        env:
          CONTAINER: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.merge.outputs.manifest_digest }}
        run: |
          cosign attest --yes \
            --predicate sbom.cyclonedx.json \
            --type cyclonedx \
            ${CONTAINER}

      # -----------------------------------------------------------------------
      - name: Print cosign verify command
        env:
          DIGEST: ${{ steps.merge.outputs.manifest_digest }}
          REPO: ${{ github.repository }}
          CONTAINER: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  Verify this image with:                                     ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "  cosign verify \\"
          echo "    --certificate-identity-regexp=\"https://github.com/${REPO}/\" \\"
          echo "    --certificate-oidc-issuer=\"https://token.actions.githubusercontent.com\" \\"
          echo "    ${CONTAINER}"
          echo ""
