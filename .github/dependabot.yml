version: 2
updates:
  # Maintain dependencies for Go
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build(go): ⬆️"
    groups:
      monthly-batch:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(github): ⬆️"
    groups:
      monthly-batch:
        patterns:
          - "*"
    cooldown:
      default-days: 7
