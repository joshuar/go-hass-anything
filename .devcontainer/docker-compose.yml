services:
  devcontainer:
    hostname: devcontainer
    env_file:
      - .env
    devices:
      - /dev/dri
    environment:
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY}
      - XDG_RUNTIME_DIR=/tmp
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
      - "${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY}:/tmp/${WAYLAND_DISPLAY}"
      - /etc/localtime:/etc/localtime:ro,cached
      - /run/dbus:/run/dbus:ro
      - /run/user/1000/bus:/run/user/1000/bus
      - go-hass-anything-datahome:/datahome
    user: vscode
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
      - label:disable
    command: -c 'sleep infinity'

  home-assistant:
    hostname: home-assistant
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    env_file:
      - .env
    image: ghcr.io/home-assistant/home-assistant:$HA_VERSION
    volumes:
      - ./data/home-assistant/config:/config
      - /run/dbus:/run/dbus:ro
    ports:
      - 8123:8123

  mosquitto:
    hostname: mosquitto
    env_file:
      - .env
    image: docker.io/eclipse-mosquitto:$MOSQUITTO_VERSION
    volumes:
      - ./data/mosquitto/config:/mosquitto/config
      - ./data/mosquitto/log:/mosquitto/log
      - mosquitto-data:/mosquitto/data
      - /etc/localtime:/etc/localtime:ro,cached
    ports:
      - 1883:1883
      - 8883:8883

volumes:
  mosquitto-data:
  go-hass-anything-datahome:
